      <script>
        (() => {
          const root = document.querySelector('[data-section-id="pg114_sec001"]');
          if (!root || root.dataset.drawingReady) return;
          root.dataset.drawingReady = 'true';
          const setup = (canvas) => {
            const context = canvas.getContext('2d');
            context.lineWidth = 5; context.lineCap = 'round'; context.strokeStyle = '#1e293b';
            let drawing = false;
            const position = (event) => { const rect = canvas.getBoundingClientRect(); return [(event.clientX - rect.left) * canvas.width / rect.width, (event.clientY - rect.top) * canvas.height / rect.height]; };
            canvas.addEventListener('pointerdown', (event) => { drawing = true; canvas.setPointerCapture(event.pointerId); const [x, y] = position(event); context.beginPath(); context.moveTo(x, y); });
            canvas.addEventListener('pointermove', (event) => { if (!drawing) return; const [x, y] = position(event); context.lineTo(x, y); context.stroke(); });
            canvas.addEventListener('pointerup', () => { drawing = false; });
            canvas.addEventListener('pointercancel', () => { drawing = false; });
          };
          root.querySelectorAll('[data-shape-canvas]').forEach(setup);
          const clear = (canvas) => canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
          const preset = (canvas, shape) => {
            const context = canvas.getContext('2d'); clear(canvas); context.beginPath();
            if (shape === 'mraba') context.rect(190, 70, 260, 260);
            if (shape === 'mstatili') context.rect(110, 105, 420, 190);
            if (shape === 'pembetatu') { context.moveTo(320, 55); context.lineTo(100, 340); context.lineTo(540, 340); context.closePath(); }
            if (shape === 'duara') context.arc(320, 200, 145, 0, Math.PI * 2);
            context.stroke();
          };
          root.querySelectorAll('[data-shape-preset]').forEach((button) => button.addEventListener('click', () => preset(root.querySelector('[data-shape-canvas="' + button.dataset.shapeTarget + '"]'), button.dataset.shapePreset)));
          root.querySelectorAll('[data-shape-clear]').forEach((button) => button.addEventListener('click', () => clear(root.querySelector('[data-shape-canvas="' + button.dataset.shapeClear + '"]'))));
        })();
      </script>
